<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
  <rect width="680" height="380" fill="#141414"/>

  <text x="12" y="17" fill="#8a8a8a" font-family="Georgia,serif" font-size="11.5">One actor, one scenario, time running left to right</text>

  <!-- lane grid -->
  <g stroke="#3a3a3a" stroke-width="1" fill="none">
    <path d="M12 26 H668"/>
    <path d="M12 54 H668"/>
    <path d="M12 106 H668"/>
    <path d="M12 158 H668"/>
    <path d="M12 262 H668"/>
    <path d="M12 314 H668"/>
    <path d="M12 366 H668"/>
    <path d="M12 26 V366"/>
    <path d="M118 26 V366"/>
    <path d="M228 26 V366"/>
    <path d="M338 26 V366"/>
    <path d="M448 26 V366"/>
    <path d="M558 26 V366"/>
    <path d="M668 26 V366"/>
  </g>

  <!-- neutral emotion baseline -->
  <path d="M118 210 H668" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 5" fill="none"/>

  <!-- lane names -->
  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="11.5" text-anchor="end">
    <text x="106" y="44">Stages</text>
    <text x="106" y="84">Actions</text>
    <text x="106" y="136">Thoughts</text>
    <text x="106" y="214">Emotion</text>
    <text x="106" y="292">Touchpoints</text>
    <text x="106" y="337">Pain point</text>
    <text x="106" y="352">+ owner</text>
  </g>

  <!-- stage names -->
  <g fill="#d4d4d4" font-family="Georgia,serif" font-size="12.5" text-anchor="middle">
    <text x="173" y="45">Trigger</text>
    <text x="283" y="45">Research</text>
    <text x="393" y="45">Choose</text>
    <text x="503" y="45">Set up</text>
    <text x="613" y="45">Use</text>
  </g>

  <!-- actions -->
  <g fill="#d4d4d4" font-family="Georgia,serif" font-size="11.5" text-anchor="middle">
    <text x="173" y="84">hits a limit</text>
    <text x="283" y="84">asks peers</text>
    <text x="393" y="84">starts trial</text>
    <text x="503" y="84">imports data</text>
    <text x="613" y="84">invites team</text>
  </g>

  <!-- thoughts -->
  <g fill="#9fb8d4" font-family="Georgia,serif" font-size="11.5" font-style="italic" text-anchor="middle">
    <text x="173" y="136">is this real?</text>
    <text x="283" y="136">who uses it?</text>
    <text x="393" y="136">can I cancel?</text>
    <text x="503" y="136">why so manual?</text>
    <text x="613" y="136">will they join?</text>
  </g>

  <!-- emotion curve -->
  <path d="M173 232 C 228 232, 238 200, 283 200 S 348 182, 393 182 C 448 182, 458 236, 503 236 S 568 190, 613 190"
        fill="none" stroke="#3B72B2" stroke-width="2"/>
  <g fill="#141414" stroke="#3B72B2" stroke-width="2">
    <circle cx="173" cy="232" r="4"/>
    <circle cx="283" cy="200" r="4"/>
    <circle cx="393" cy="182" r="4"/>
    <circle cx="613" cy="190" r="4"/>
  </g>
  <circle cx="503" cy="236" r="5" fill="#C77D1E" stroke="#141414" stroke-width="2"/>

  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="10.5" text-anchor="middle">
    <text x="173" y="248">annoyed</text>
    <text x="283" y="190">curious</text>
    <text x="393" y="172">hopeful</text>
    <text x="613" y="180">relieved</text>
  </g>
  <text x="503" y="252" fill="#C77D1E" font-family="Georgia,serif" font-size="10.5" text-anchor="middle">frustrated</text>

  <!-- touchpoints -->
  <g fill="#d4d4d4" font-family="Georgia,serif" font-size="11.5" text-anchor="middle">
    <text x="173" y="292">usage warning</text>
    <text x="283" y="292">peer forum</text>
    <text x="393" y="292">pricing page</text>
    <text x="503" y="292">import wizard</text>
    <text x="613" y="292">invite modal</text>
  </g>

  <!-- pain point tied to an owner -->
  <rect x="452" y="322" width="102" height="36" rx="4" fill="#1d1a14" stroke="#C77D1E" stroke-width="1.4"/>
  <g font-family="Georgia,serif" text-anchor="middle">
    <text x="503" y="336" fill="#d4d4d4" font-size="10.5">import fails</text>
    <text x="503" y="350" fill="#8a8a8a" font-size="10.5">Platform team</text>
  </g>
</svg>
