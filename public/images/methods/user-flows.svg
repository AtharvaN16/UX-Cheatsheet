<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img">
  <defs>
    <marker id="uf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#141414"/>

  <!-- entry-point grouping -->
  <rect x="12" y="30" width="122" height="196" rx="6" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="73" y="22" text-anchor="middle" fill="#8a8a8a" font-family="Georgia,serif" font-size="12">Entry points</text>

  <!-- connectors -->
  <g fill="none" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#uf-arrow)">
    <path d="M134 60 H150 V128 H162"/>
    <path d="M134 128 H162"/>
    <path d="M134 196 H150 V128 H162"/>
    <path d="M272 128 H298"/>
    <path d="M336 100 V60 H396"/>
    <path d="M336 156 V212 H396"/>
    <path d="M448 195 V80"/>
    <path d="M508 60 H548"/>
  </g>

  <!-- entry nodes -->
  <g fill="#1b1720" stroke="#8a6fd6" stroke-width="1.4">
    <rect x="30" y="43" width="104" height="34" rx="4"/>
    <rect x="30" y="111" width="104" height="34" rx="4"/>
    <rect x="30" y="179" width="104" height="34" rx="4"/>
  </g>

  <!-- main path nodes -->
  <g fill="#1b1720" stroke="#6B46C1" stroke-width="1.6">
    <rect x="168" y="111" width="104" height="34" rx="4"/>
    <rect x="404" y="43" width="104" height="34" rx="4"/>
  </g>

  <!-- detour node -->
  <rect x="404" y="195" width="104" height="34" rx="4" fill="#1b1720" stroke="#C77D1E" stroke-width="1.4"/>

  <!-- terminal node -->
  <rect x="556" y="43" width="104" height="34" rx="4" fill="#161e1c" stroke="#2E8A75" stroke-width="1.6"/>

  <!-- decision point -->
  <path d="M336 100 L364 128 L336 156 L308 128 z" fill="#1d1a14" stroke="#C77D1E" stroke-width="1.6"/>

  <!-- node labels -->
  <g fill="#d4d4d4" font-family="Georgia,serif" font-size="12.5" text-anchor="middle">
    <text x="82" y="64">Email link</text>
    <text x="82" y="132">Home nav</text>
    <text x="82" y="200">Search result</text>
    <text x="220" y="132">Product page</text>
    <text x="456" y="64">Checkout</text>
    <text x="456" y="216">Sign in</text>
    <text x="608" y="64">Order placed</text>
  </g>

  <!-- condition labels -->
  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="11.5">
    <text x="374" y="126">signed in?</text>
    <text x="344" y="88">yes</text>
    <text x="344" y="176">no</text>
    <text x="456" y="253" text-anchor="middle">rejoins the main path</text>
  </g>
</svg>
