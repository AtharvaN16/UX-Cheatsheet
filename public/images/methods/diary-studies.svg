<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
  <rect width="680" height="340" fill="#141414"/>

  <!-- day gridlines -->
  <g stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 5">
    <line x1="170" y1="46" x2="170" y2="300"/>
    <line x1="240" y1="46" x2="240" y2="300"/>
    <line x1="310" y1="46" x2="310" y2="300"/>
    <line x1="380" y1="46" x2="380" y2="300"/>
    <line x1="450" y1="46" x2="450" y2="300"/>
    <line x1="520" y1="46" x2="520" y2="300"/>
    <line x1="590" y1="46" x2="590" y2="300"/>
    <line x1="660" y1="46" x2="660" y2="300"/>
  </g>

  <!-- day labels -->
  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="12" text-anchor="middle">
    <text x="135" y="38">Mon</text>
    <text x="205" y="38">Tue</text>
    <text x="275" y="38">Wed</text>
    <text x="345" y="38">Thu</text>
    <text x="415" y="38">Fri</text>
    <text x="485" y="38">Sat</text>
    <text x="555" y="38">Sun</text>
    <text x="625" y="38">Mon</text>
  </g>

  <!-- row baselines -->
  <g stroke="#3a3a3a" stroke-width="1">
    <line x1="100" y1="78" x2="660" y2="78"/>
    <line x1="100" y1="146" x2="660" y2="146"/>
    <line x1="100" y1="214" x2="660" y2="214"/>
    <line x1="100" y1="282" x2="660" y2="282"/>
  </g>

  <!-- row labels -->
  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="13" text-anchor="end">
    <text x="88" y="74">Real events</text>
    <text x="88" y="142">Event-based</text>
    <text x="88" y="210">Interval-based</text>
    <text x="88" y="278">Signal-based</text>
  </g>

  <!-- row 1: the actual behaviour, 9 episodes -->
  <g fill="#8a8a8a">
    <circle cx="124" cy="78" r="4"/>
    <circle cx="158" cy="78" r="4"/>
    <circle cx="228" cy="78" r="4"/>
    <circle cx="332" cy="78" r="4"/>
    <circle cx="364" cy="78" r="4"/>
    <circle cx="398" cy="78" r="4"/>
    <circle cx="470" cy="78" r="4"/>
    <circle cx="562" cy="78" r="4"/>
    <circle cx="636" cy="78" r="4"/>
  </g>

  <!-- row 2: event-based — one entry per episode, same positions -->
  <g fill="#2E8A75">
    <rect x="120" y="134" width="8" height="24" rx="2"/>
    <rect x="154" y="134" width="8" height="24" rx="2"/>
    <rect x="224" y="134" width="8" height="24" rx="2"/>
    <rect x="328" y="134" width="8" height="24" rx="2"/>
    <rect x="360" y="134" width="8" height="24" rx="2"/>
    <rect x="394" y="134" width="8" height="24" rx="2"/>
    <rect x="466" y="134" width="8" height="24" rx="2"/>
    <rect x="558" y="134" width="8" height="24" rx="2"/>
    <rect x="632" y="134" width="8" height="24" rx="2"/>
  </g>
  <text x="652" y="120" text-anchor="end" fill="#2E8A75" font-family="Georgia,serif" font-size="12">9 entries · every episode kept separate</text>

  <!-- row 3: interval-based — one end-of-day summary, episodes collapsed -->
  <g fill="none" stroke="#3B72B2" stroke-width="1.2">
    <rect x="104" y="202" width="62" height="24" rx="2"/>
    <rect x="174" y="202" width="62" height="24" rx="2"/>
    <rect x="244" y="202" width="62" height="24" rx="2"/>
    <rect x="314" y="202" width="62" height="24" rx="2"/>
    <rect x="384" y="202" width="62" height="24" rx="2"/>
    <rect x="454" y="202" width="62" height="24" rx="2"/>
    <rect x="524" y="202" width="62" height="24" rx="2"/>
    <rect x="594" y="202" width="62" height="24" rx="2"/>
  </g>
  <g fill="#3B72B2">
    <rect x="160" y="202" width="6" height="24"/>
    <rect x="230" y="202" width="6" height="24"/>
    <rect x="370" y="202" width="6" height="24"/>
    <rect x="440" y="202" width="6" height="24"/>
    <rect x="510" y="202" width="6" height="24"/>
    <rect x="580" y="202" width="6" height="24"/>
    <rect x="650" y="202" width="6" height="24"/>
  </g>
  <text x="652" y="188" text-anchor="end" fill="#3B72B2" font-family="Georgia,serif" font-size="12">8 day-end entries · Thursday&#8217;s three collapse into one</text>

  <!-- row 4: signal-based — prompts at researcher-chosen times -->
  <g stroke="#B24A58" stroke-width="1.2">
    <line x1="158" y1="262" x2="158" y2="282"/>
    <line x1="266" y1="262" x2="266" y2="282"/>
    <line x1="364" y1="262" x2="364" y2="282"/>
    <line x1="500" y1="262" x2="500" y2="282"/>
    <line x1="608" y1="262" x2="608" y2="282"/>
  </g>
  <g fill="#B24A58">
    <polygon points="158,262 153,254 163,254"/>
    <polygon points="266,262 261,254 271,254"/>
    <polygon points="364,262 359,254 369,254"/>
    <polygon points="500,262 495,254 505,254"/>
    <polygon points="608,262 603,254 613,254"/>
  </g>
  <!-- prompts that landed with no episode nearby -->
  <g fill="none" stroke="#B24A58" stroke-width="1" stroke-dasharray="2 3">
    <circle cx="266" cy="296" r="7"/>
    <circle cx="500" cy="296" r="7"/>
    <circle cx="608" cy="296" r="7"/>
  </g>
  <text x="652" y="248" text-anchor="end" fill="#B24A58" font-family="Georgia,serif" font-size="12">5 prompts · 2 catch an episode, 3 land on nothing</text>

  <text x="100" y="322" fill="#8a8a8a" font-family="Georgia,serif" font-size="12" font-style="italic">The cadence, not the sample size, decides what the study can ever show.</text>
</svg>
