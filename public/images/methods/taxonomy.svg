<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <rect width="560" height="360" fill="#141414"/>
  <line x1="280" y1="28" x2="280" y2="332" stroke="#3a3a3a" stroke-width="1"/>

  <g font-family="Georgia,serif" text-anchor="middle">
    <text x="145" y="44" font-size="14" fill="#8C77B8">Hierarchy</text>
    <text x="145" y="62" font-size="10" fill="#6a6a6a">one organizing principle per level</text>
    <text x="420" y="44" font-size="14" fill="#D99B43">Facets</text>
    <text x="420" y="62" font-size="10" fill="#6a6a6a">independent dimensions, combined</text>
  </g>

  <g stroke="#3a3a3a" stroke-width="1" fill="none">
    <path d="M145 106 L145 122 L78 122 L78 138"/>
    <path d="M145 106 L145 122 L212 122 L212 138"/>
    <path d="M78 160 L78 192"/>
    <path d="M212 160 L212 192"/>
    <path d="M78 214 L78 246"/>
  </g>

  <g font-family="Georgia,serif" font-size="11" text-anchor="middle">
    <rect x="105" y="82" width="80" height="24" rx="3" fill="none" stroke="#8C77B8" stroke-width="1"/>
    <text x="145" y="98" fill="#c9c9c9">Indoor</text>

    <rect x="40" y="138" width="76" height="22" rx="3" fill="none" stroke="#5a5a5a"/>
    <text x="78" y="153" fill="#8a8a8a">Low light</text>
    <rect x="174" y="138" width="76" height="22" rx="3" fill="none" stroke="#5a5a5a"/>
    <text x="212" y="153" fill="#8a8a8a">Bright</text>

    <rect x="40" y="192" width="76" height="22" rx="3" fill="none" stroke="#5a5a5a"/>
    <text x="78" y="207" fill="#8a8a8a">Ferns</text>
    <rect x="174" y="192" width="76" height="22" rx="3" fill="none" stroke="#5a5a5a"/>
    <text x="212" y="207" fill="#8a8a8a">Succulents</text>

    <rect x="34" y="246" width="88" height="22" rx="3" fill="#8C77B8"/>
    <text x="78" y="261" fill="#141414">Boston fern</text>
  </g>

  <g font-family="Georgia,serif" font-size="10" fill="#6a6a6a" text-anchor="middle">
    <text x="145" y="300">filed once — reachable by one path</text>
    <text x="420" y="300">tagged on every axis — many valid paths</text>
  </g>

  <g font-family="Georgia,serif" font-size="10">
    <text x="304" y="103" fill="#8a8a8a">Light</text>
    <text x="304" y="153" fill="#8a8a8a">Care</text>
    <text x="304" y="203" fill="#8a8a8a">Pet-safe</text>
  </g>

  <g font-family="Georgia,serif" font-size="10" text-anchor="middle">
    <rect x="352" y="86" width="52" height="20" rx="10" fill="none" stroke="#5a5a5a"/>
    <text x="378" y="100" fill="#8a8a8a">Low</text>
    <rect x="410" y="86" width="52" height="20" rx="10" fill="#D99B43"/>
    <text x="436" y="100" fill="#141414">Bright</text>
    <rect x="468" y="86" width="52" height="20" rx="10" fill="none" stroke="#5a5a5a"/>
    <text x="494" y="100" fill="#8a8a8a">Sun</text>

    <rect x="352" y="136" width="52" height="20" rx="10" fill="#D99B43"/>
    <text x="378" y="150" fill="#141414">Easy</text>
    <rect x="410" y="136" width="52" height="20" rx="10" fill="none" stroke="#5a5a5a"/>
    <text x="436" y="150" fill="#8a8a8a">Medium</text>
    <rect x="468" y="136" width="52" height="20" rx="10" fill="none" stroke="#5a5a5a"/>
    <text x="494" y="150" fill="#8a8a8a">Fussy</text>

    <rect x="352" y="186" width="52" height="20" rx="10" fill="#D99B43"/>
    <text x="378" y="200" fill="#141414">Yes</text>
    <rect x="410" y="186" width="52" height="20" rx="10" fill="none" stroke="#5a5a5a"/>
    <text x="436" y="200" fill="#8a8a8a">No</text>
  </g>

  <g font-family="Georgia,serif" text-anchor="middle">
    <text x="420" y="240" font-size="10" fill="#6a6a6a">Bright + Easy + Pet-safe</text>
    <rect x="376" y="250" width="88" height="22" rx="3" fill="none" stroke="#D99B43" stroke-width="1"/>
    <text x="420" y="265" font-size="11" fill="#D99B43">Boston fern</text>
  </g>
</svg>
