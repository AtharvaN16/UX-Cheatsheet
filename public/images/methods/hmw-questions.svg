<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <rect width="560" height="360" fill="#141414"/>

  <rect x="150" y="64" width="150" height="232" fill="#5A92C6" opacity="0.07"/>
  <g stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 4">
    <line x1="150" y1="64" x2="150" y2="296"/>
    <line x1="300" y1="64" x2="300" y2="296"/>
  </g>

  <g fill="#8a8a8a" font-family="Georgia,serif" font-size="11">
    <text x="225" y="56" text-anchor="middle">workable scope</text>
    <text x="90" y="56">narrower</text>
    <text x="490" y="56" text-anchor="end">broader</text>
  </g>

  <g font-family="Georgia,serif">
    <rect x="90" y="88" width="400" height="6" fill="#B24A58"/>
    <text x="82" y="94" text-anchor="end" fill="#B24A58" font-size="12">Too broad</text>
    <text x="90" y="116" fill="#cfcfcf" font-size="13">How might we reinvent urban mobility?</text>
    <text x="90" y="134" fill="#6a6a6a" font-size="11" font-style="italic">a hundred answers, none of them sketchable</text>

    <rect x="90" y="172" width="180" height="6" fill="#5A92C6"/>
    <text x="82" y="178" text-anchor="end" fill="#5A92C6" font-size="12">Workable</text>
    <text x="90" y="200" fill="#cfcfcf" font-size="13">How might we make a first ride feel safe without a helmet?</text>
    <text x="90" y="218" fill="#6a6a6a" font-size="11" font-style="italic">vending, partner discount, slower first ride — all different</text>

    <rect x="90" y="256" width="28" height="6" fill="#B24A58"/>
    <text x="82" y="262" text-anchor="end" fill="#B24A58" font-size="12">Too narrow</text>
    <text x="90" y="284" fill="#cfcfcf" font-size="13">How might we hide the helmet warning?</text>
    <text x="90" y="302" fill="#6a6a6a" font-size="11" font-style="italic">one answer, and the question already chose it</text>
  </g>

  <text x="280" y="338" text-anchor="middle" fill="#6a6a6a" font-family="Georgia,serif" font-size="11" font-style="italic">one problem, three scopes — only the middle rung can be sketched</text>
</svg>
