<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <rect width="560" height="360" fill="#141414"/>
  <defs>
    <marker id="mmd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <g font-family="Georgia,serif" font-size="13" fill="#c8c8c8">
    <text x="30" y="40">Convergent parallel</text>
    <text x="30" y="158">Explanatory sequential</text>
    <text x="30" y="254">Exploratory sequential</text>
  </g>

  <rect x="30" y="52" width="200" height="18" rx="3" fill="#3B72B2"/>
  <rect x="30" y="76" width="200" height="18" rx="3" fill="#2E8A75"/>
  <path d="M238 63 L288 79" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#mmd-arrow)"/>
  <path d="M238 89 L288 79" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#mmd-arrow)"/>
  <text x="304" y="84" font-family="Georgia,serif" font-size="12" fill="#c8c8c8">Merged in one joint display</text>

  <rect x="30" y="170" width="170" height="18" rx="3" fill="#3B72B2"/>
  <path d="M208 179 L232 179" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#mmd-arrow)"/>
  <rect x="240" y="170" width="150" height="18" rx="3" fill="#2E8A75"/>

  <rect x="30" y="266" width="170" height="18" rx="3" fill="#2E8A75"/>
  <path d="M208 275 L232 275" stroke="#8a8a8a" stroke-width="1.2" fill="none" marker-end="url(#mmd-arrow)"/>
  <rect x="240" y="266" width="150" height="18" rx="3" fill="#3B72B2"/>

  <g font-family="Georgia,serif" font-size="11" fill="#141414" text-anchor="middle">
    <text x="130" y="65">QUANT</text>
    <text x="130" y="89">QUAL</text>
    <text x="115" y="183">QUANT</text>
    <text x="315" y="183">QUAL</text>
    <text x="115" y="279">QUAL</text>
    <text x="315" y="279">QUANT</text>
  </g>

  <g font-family="Georgia,serif" font-size="11" fill="#7a7a7a">
    <text x="30" y="116">Both strands run at once and are analysed separately. Neither leads.</text>
    <text x="30" y="212">Quant leads. The qual sample is drawn from inside the result it explains.</text>
    <text x="30" y="308">Qual leads. Its categories become the instrument quant measures with.</text>
  </g>

  <g stroke="#3a3a3a" stroke-width="1">
    <line x1="30" y1="132" x2="530" y2="132"/>
    <line x1="30" y1="228" x2="530" y2="228"/>
  </g>

  <g font-family="Georgia,serif" font-size="11" fill="#5f5f5f">
    <text x="530" y="340" text-anchor="end">Time runs left to right &#183; after Creswell &amp; Plano Clark</text>
  </g>
</svg>
